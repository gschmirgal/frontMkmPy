# Routes WITHOUT locale prefix (must be first to have priority)
root_redirect:
    path: /
    controller: App\Controller\LocaleRedirectController::redirectToLocale
    methods: [GET]

cache_warmup:
    path: /cache/warmup
    controller: App\Controller\CacheWarmupController::warmup
    methods: [GET]

# Routes avec locale
controllers_with_locale:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    prefix: '/{_locale}'
    requirements:
        _locale: 'en|fr'
    defaults:
        _locale: 'en'
